name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Format, vet, test, dan build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Periksa format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Berkas berikut belum diformat:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test ./... -cover

      - name: Build
        run: go build -o nusa ./cmd/nusa

      - name: Jalankan contoh
        run: |
          for file in examples/*.nusa; do
            echo "== $file"
            ./nusa run "$file" > /dev/null
          done
